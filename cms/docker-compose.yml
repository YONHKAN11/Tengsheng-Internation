services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tengsheng
      POSTGRES_USER: tengsheng
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tengsheng']
      interval: 10s
      timeout: 5s
      retries: 5

  cms:
    build: .
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://tengsheng:change-me@db:5432/tengsheng
      PAYLOAD_SECRET: change-me-to-a-long-random-string
      ADMIN_EMAIL: admin@tengsheng.local
      ADMIN_PASSWORD: Tengsheng-Admin-2026
      # First run only: creates the Postgres tables. Remove afterwards.
      PAYLOAD_PUSH: 'true'
    volumes:
      - media:/app/media
      - videos:/app/videos
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  videos:
