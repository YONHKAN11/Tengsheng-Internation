name: Build container images

on:
  push:
    branches: [main]
    paths:
      - 'cms/**'
      - 'site/**'
      - 'site-builder/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/cms-image.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push CMS
        uses: docker/build-push-action@v6
        with:
          context: ./cms
          push: true
          tags: ghcr.io/yonhkan11/tengsheng-cms:latest
          cache-from: type=gha,scope=cms
          cache-to: type=gha,mode=max,scope=cms

      - name: Build and push site builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./site-builder/Dockerfile
          push: true
          tags: ghcr.io/yonhkan11/tengsheng-site-builder:latest
          cache-from: type=gha,scope=site-builder
          cache-to: type=gha,mode=max,scope=site-builder
